# Local observability stack: API + Prometheus + Grafana (+ optional MLflow UI).
#   make model && docker compose up --build
#   API http://localhost:8000  Prometheus http://localhost:9090  Grafana http://localhost:3000
# The demo API key is "local-dev-key" (only its SHA-256 is configured below).
name: fraudguard

services:
  api:
    build: .
    image: fraudguard:local
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      # sha256("local-dev-key"); generate your own with `fraudguard hash-key`
      FRAUDGUARD_API_KEY_HASHES: "${FRAUDGUARD_API_KEY_HASHES:-ed5a18fb8f807f996d649e379d3f35f39c543a91bdbf88c492f2ebd10d4df86c}"
      FRAUDGUARD_ENABLE_DOCS: "true"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.5.0
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports:
      - "127.0.0.1:9090:9090"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    depends_on: [api]

  grafana:
    image: grafana/grafana:12.1.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD}"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3000:3000"
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    depends_on: [prometheus]

  mlflow:
    profiles: [tracking]
    image: ghcr.io/mlflow/mlflow:v3.17.0
    command: mlflow server --backend-store-uri sqlite:////mlflow/mlflow.db --host 0.0.0.0 --port 5000
    volumes:
      - ./mlflow.db:/mlflow/mlflow.db
    ports:
      - "127.0.0.1:5000:5000"
