version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      python-deps:
        patterns: ["*"]
  # Bumps the pinned SHA and its version comment together.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
  # Keeps digest-pinned base images current.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
