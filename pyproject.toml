[project]
name = "fraudguard"
version = "1.0.0"
description = "Fraud-detection model shipped through a hardened, verifiable ML supply chain (DevSecMLOps reference build)."
readme = "README.md"
license = "MIT"
authors = [{ name = "kamalesansam" }]
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "scikit-learn>=1.6",
    "skops>=0.13",
    "pyyaml>=6.0",
    "typer>=0.15",
]

[project.optional-dependencies]
serve = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.10",
    "prometheus-client>=0.21",
]
pipeline = [
    "dvc>=3.59",
    "mlflow>=3.0",
    "pandera[pandas]>=0.24",
    "scipy>=1.14",
    "evidently>=0.7",
]

[project.scripts]
fraudguard = "fraudguard.cli:app"
fraudguard-serve = "fraudguard.serve.app:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "httpx>=0.28",
    "ruff>=0.9",
    "bandit[sarif]>=1.8",
    "pip-audit>=2.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fraudguard"]

[tool.ruff]
extend-exclude = [".semgrep"]  # deliberately insecure rule-test fixtures
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["S101"]  # asserts are fine in tests

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["fraudguard"]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
