apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - serviceaccount.yaml
  - configmap.yaml
  - deployment.yaml
  - service.yaml
  - hpa.yaml
  - pdb.yaml
  - networkpolicy.yaml
# The API-key Secret is NOT in git. Create it out of band (or via External
# Secrets / Sealed Secrets):
#   kubectl -n fraudguard create secret generic fraudguard-api-keys \
#     --from-literal=hashes="$(fraudguard hash-key)"
